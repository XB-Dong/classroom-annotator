  "components": {
    "schemas": {
      "Video": {
        "type": "object",
        "required": [
          "id",
          "name",
          "width",
          "height",
          "durationSeconds",
          "status",
          "createdAt"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "width": {
            "type": "integer",
            "minimum": 1
          },
          "height": {
            "type": "integer",
            "minimum": 1
          },
          "durationSeconds": {
            "type": "number",
            "exclusiveMinimum": 0
          },
          "status": {
            "const": "ready"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Job": {
        "type": "object",
        "required": [
          "id",
          "kind",
          "status",
          "progress",
          "createdAt"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "kind": {
            "enum": [
              "extraction",
              "import"
            ]
          },
          "videoId": {
            "type": "string"
          },
          "batchId": {
            "type": "string"
          },
          "status": {
            "enum": [
              "queued",
              "running",
              "cancelling",
              "completed",
              "failed",
              "cancelled"
            ]
          },
          "progress": {
            "type": "number",
            "minimum": 0,
            "maximum": 1
          },
          "error": {
            "type": "string"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Batch": {
        "type": "object",
        "required": [
          "id",
          "videoId",
          "jobId",
          "createdAt",
          "frameCount"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "videoId": {
            "type": "string"
          },
          "jobId": {
            "type": "string"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "frameCount": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Frame": {
        "type": "object",
        "required": [
          "id",
          "videoId",
          "batchId",
          "timestampMs",
          "width",
          "height",
          "imageUrl",
          "status",
          "revision"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "videoId": {
            "type": "string"
          },
          "batchId": {
            "type": "string"
          },
          "timestampMs": {
            "type": "integer",
            "minimum": 0
          },
          "width": {
            "type": "integer",
            "minimum": 1
          },
          "height": {
            "type": "integer",
            "minimum": 1
          },
          "imageUrl": {
            "type": "string"
          },
          "status": {
            "$ref": "#/components/schemas/FrameStatus"
          },
          "revision": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "FrameStatus": {
        "enum": [
          "not_started",
          "in_progress",
          "completed"
        ]
      },
      "Annotation": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "bbox",
          "source"
        ],
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "bbox": {
            "type": "array",
            "minItems": 4,
            "maxItems": 4,
            "items": {
              "type": "number"
            }
          },
          "source": {
            "const": "manual"
          }
        }
      },
      "Snapshot": {
        "type": "object",
        "required": [
          "frameId",
          "revision",
          "status",
          "annotations"
        ],
        "properties": {
          "frameId": {
            "type": "string"
          },
          "revision": {
            "type": "integer",
            "minimum": 0
          },
          "status": {
            "$ref": "#/components/schemas/FrameStatus"
          },
          "annotations": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Annotation"
            }
          }
        }
      },
      "SaveAnnotations": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "expectedRevision",
          "status",
          "annotations"
        ],
        "properties": {
          "expectedRevision": {
            "type": "integer",
            "minimum": 0
          },
          "status": {
            "$ref": "#/components/schemas/FrameStatus"
          },
          "annotations": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Annotation"
            }
          }
        }
      },
      "ExtractionRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "intervalSeconds"
        ],
        "properties": {
          "intervalSeconds": {
            "type": "number",
            "multipleOf": 0.001,
            "minimum": 0.001
          },
          "startSeconds": {
            "type": "number",
            "minimum": 0,
            "default": 0,
            "multipleOf": 0.001
          },
          "endSeconds": {
            "type": "number",
            "multipleOf": 0.001,
            "minimum": 0.001
          }
        }
      },
      "ExportRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "videoId": {
            "type": "string"
          },
          "batchId": {
            "type": "string"
          },
          "frameIds": {
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "type": "string"
            }
          }
        },
        "oneOf": [
          {
            "required": [
              "videoId"
            ],
            "not": {
              "required": [
                "frameIds"
              ]
            }
          },
          {
            "required": [
              "frameIds"
            ],
            "not": {
              "anyOf": [
