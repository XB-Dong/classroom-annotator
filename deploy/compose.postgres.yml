services:
  postgres:
    image: ${POSTGRES_IMAGE:?set verified immutable PostgreSQL 17 image}
    pull_policy: never
    restart: unless-stopped
    env_file: ["${POSTGRES_ENV_FILE:?set external PostgreSQL initialization environment}"]
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    expose: ["5432"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "0.50"
    pids_limit: 96
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: {soft: 0, hard: 0}
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  backend:
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      APP_DATABASE_URL: ${APP_DATABASE_URL:?set external application DML-only PostgreSQL URL}
      APP_DB_MAX_OPEN_CONNS: ${APP_DB_MAX_OPEN_CONNS:-5}
      APP_DB_MAX_IDLE_CONNS: ${APP_DB_MAX_IDLE_CONNS:-2}
      APP_DB_CONNECT_TIMEOUT_SECONDS: ${APP_DB_CONNECT_TIMEOUT_SECONDS:-5}
      APP_DB_QUERY_TIMEOUT_SECONDS: ${APP_DB_QUERY_TIMEOUT_SECONDS:-10}
      APP_DB_CONN_MAX_LIFETIME_SECONDS: ${APP_DB_CONN_MAX_LIFETIME_SECONDS:-1800}
      APP_DB_CONN_MAX_IDLE_SECONDS: ${APP_DB_CONN_MAX_IDLE_SECONDS:-300}
    memswap_limit: 512m
    ulimits:
      core: {soft: 0, hard: 0}
  frontend:
    memswap_limit: 64m
    ulimits:
      core: {soft: 0, hard: 0}
volumes:
  postgres-data: {external: true, name: "${POSTGRES_DATA_VOLUME:?create external PostgreSQL volume}"}
