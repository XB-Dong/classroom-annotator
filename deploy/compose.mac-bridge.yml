# Independent relay; combine only after the external gateway config is verified.
name: classroom-mac-bridge
services:
  relay:
    image: ${MAC_BRIDGE_NGINX_IMAGE:?set immutable verified Nginx image}
    pull_policy: never
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    network_mode: host
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: {soft: 0, hard: 0}
    volumes:
      - ${MAC_BRIDGE_CONFIG_PATH:?set external generated relay config}:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=0700
    mem_limit: 64m
    memswap_limit: 64m
    cpus: "0.15"
    pids_limit: 32
    logging: {driver: "none"}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://${BRIDGE_BIND_ADDRESS:?set actual private Docker gateway}:19091/_relay/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
