# Current-host media only. Every bind source stays outside the checkout.
services:
  backend:
    environment:
      APP_SAMPLE_CATALOG_FILE: /publisher/catalog.json
      APP_LOCAL_SOURCE_DIRS: /sources
      APP_MEDIA_DOWNLOAD_TIMEOUT_SECONDS: ${APP_MEDIA_DOWNLOAD_TIMEOUT_SECONDS:-1800}
    volumes:
      - ${PUBLIC_SAMPLE_DIRECTORY:?set external public media directory}:/publisher:ro
      - ${LOCAL_SOURCE_DIRECTORY:?set external authorized same-host directory}:/sources:ro
      - ${AI_TOKEN_HOST_FILE:?set restricted external internal token file}:/app-secrets/ai-token:ro
