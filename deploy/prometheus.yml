global:
  scrape_interval: 30s
  evaluation_interval: 30s
scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend:8080"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
