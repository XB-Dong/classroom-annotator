# Install the application session release before removing the historical Basic overlay.
services:
  frontend:
    ports:
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:443:443"
    volumes:
      - ./deploy/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_BUNDLE_DIRECTORY:?set external certificate bundle}:/etc/nginx/tls:ro
      - ${ACME_WEBROOT_DIRECTORY:?set external ACME webroot}:/var/www/acme:ro
